[project]
name = "diagnosticmultimodal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jerymy-k", email = "karimimoha0@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.156.1",
    "ipykernel>=7.4.0",
    "mlflow>=3.17.1",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.66.0",
    "tensorflow[and-cuda]>=2.21.0",
    "ultralytics>=8.4.183",
    "uvicorn>=0.54.0",
]

[project.scripts]
diagnosticmultimodal = "diagnosticmultimodal:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
